<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Surgery</title>
<style>
:root{
  --bg:#edf1f7;
  --card:#fff;
  --text:#1a2e4a;
  --body:#2c3e50;
  --muted:#8898aa;
  --border:#dde4ef;
  --accent:#c0542a;
  --accent-bg:#fff0eb;
  --ok:#2e7d32;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--body);padding-bottom:76px}

header{position:sticky;top:0;z-index:10;background:var(--card);padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.logo{font-weight:800;font-size:18px;color:var(--text);letter-spacing:-.5px}
.logo em{font-style:normal;color:var(--accent)}
.nav-link{color:var(--accent);text-decoration:none;font-weight:600;font-size:14px}

.wrap{padding:16px;max-width:640px;margin:auto}

.section-hd{font-size:16px;font-weight:700;color:var(--text);padding:14px 0 8px;display:flex;align-items:center;justify-content:space-between}
.section-hd:first-child{padding-top:4px}
.section-hd .sub{color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}

.area-block{background:var(--card);border:1.5px solid var(--border);border-radius:16px;margin-bottom:4px;overflow:hidden;box-shadow:var(--shadow)}
.area-block textarea{width:100%;border:none;outline:none;background:transparent;padding:16px;font-size:16px;color:var(--body);resize:vertical;min-height:150px;display:block;font-family:inherit;line-height:1.5}
.area-stats{display:flex;gap:10px;padding:7px 14px;border-top:1px solid var(--border);background:#f8fafd;font-size:13px;color:var(--muted)}
.area-btns{display:flex;gap:8px;padding:9px 12px;border-top:1px solid var(--border);align-items:center}
.icon-btn{display:flex;align-items:center;gap:5px;padding:8px 14px;border:1.5px solid var(--border);border-radius:10px;background:transparent;cursor:pointer;font-size:14px;font-weight:600;color:var(--text);font-family:inherit;transition:border-color .1s,color .1s}
.icon-btn:hover,.icon-btn:active{border-color:var(--accent);color:var(--accent)}
.icon-btn.ok{background:#e8f5e9;color:var(--ok);border-color:#a5d6a7}

.list-card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:4px;overflow:hidden}

.action-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;transition:background .1s}
.action-row:last-child{border-bottom:none}
.action-row:active{background:#f5f7fa}
.action-row.on{background:var(--accent-bg)}
.badge{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;font-family:ui-monospace,Consolas,monospace;flex:none;letter-spacing:-.3px}
.row-label{flex:1;font-size:16px;font-weight:500;color:var(--body)}
.chkbox{width:22px;height:22px;flex:none;border:2px solid #c0c8d8;border-radius:5px;display:flex;align-items:center;justify-content:center;color:transparent;transition:all .1s}
.action-row.on .chkbox{background:var(--accent);border-color:var(--accent);color:white}

.input-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.input-row:last-child{border-bottom:none}
.input-row .badge{opacity:.8}
.input-row input{flex:1;border:none;outline:none;background:transparent;font-size:16px;color:var(--body);font-family:inherit;min-width:0;padding:2px 0}
.input-row input::placeholder{color:var(--muted)}
.input-row .re-toggle{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;flex:none}
.input-row .re-toggle input[type=checkbox]{width:15px;height:15px;cursor:pointer}

.recipe-scroll{display:flex;gap:10px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.recipe-scroll::-webkit-scrollbar{display:none}
.pill{flex:none;padding:9px 18px;border-radius:24px;background:transparent;border:1.5px solid var(--border);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;transition:border-color .1s,color .1s}
.pill:hover,.pill:active{border-color:var(--accent);color:var(--accent)}

.bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:12px 16px;z-index:20}
.bar-inner{display:flex;gap:8px;max-width:640px;margin:auto}
.btn{flex:1;padding:13px;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;transition:opacity .1s}
.btn:active{opacity:.88}
.btn-accent{background:var(--accent);color:white}
.btn-ghost{background:var(--bg);color:var(--text);border:1.5px solid var(--border)}
.btn.ok{background:#e8f5e9;color:var(--ok);border-color:#a5d6a7}
</style>
</head>
<body>

<header>
  <div class="logo">Text <em>Surgery</em></div>
  <a href="regex.html" class="nav-link">Regex Helper →</a>
</header>

<div class="wrap">

<div class="section-hd" style="padding-top:4px">Input</div>
<div class="area-block">
  <textarea id="input" placeholder="Paste your text here…"></textarea>
  <div class="area-stats">
    <span id="st-chars">0 chars</span>&nbsp;·&nbsp;
    <span id="st-words">0 words</span>&nbsp;·&nbsp;
    <span id="st-lines">0 lines</span>
  </div>
  <div class="area-btns">
    <button class="icon-btn" onclick="pasteIn()">⬇ Paste</button>
    <button class="icon-btn" onclick="clearIn()">✕ Clear</button>
  </div>
</div>

<div class="section-hd" style="padding-top:18px">Line Filters</div>
<div class="list-card">
  <div class="input-row">
    <div class="badge" style="background:#ffebee;color:#c62828">✕L</div>
    <input id="removeStart" type="text" placeholder="Remove lines starting with…">
  </div>
  <div class="input-row">
    <div class="badge" style="background:#e8f5e9;color:#2e7d32">✓L</div>
    <input id="keepStart" type="text" placeholder="Keep only lines starting with…">
  </div>
</div>

<div class="section-hd" style="padding-top:18px">
  Find &amp; Replace
  <a href="regex.html" class="sub">Regex Help →</a>
</div>
<div class="list-card">
  <div class="input-row">
    <div class="badge" style="background:#e3f2fd;color:#1565c0">F</div>
    <input id="findText" type="text" placeholder="Find…">
  </div>
  <div class="input-row">
    <div class="badge" style="background:#f3e5f5;color:#6a1b9a">R</div>
    <input id="replaceText" type="text" placeholder="Replace with…">
    <label class="re-toggle"><input type="checkbox" id="findRegex"> regex</label>
  </div>
</div>

<div class="section-hd" style="padding-top:18px">Quick Recipes</div>
<div class="list-card">
  <div class="recipe-scroll">
    <button class="pill" onclick="recipe('prompt')">Prompt Compact</button>
    <button class="pill" onclick="recipe('markdown')">Markdown → Plain</button>
    <button class="pill" onclick="recipe('json')">JSON → One Line</button>
    <button class="pill" onclick="recipe('clear')">Clear All</button>
  </div>
</div>

<div class="section-hd" style="padding-top:18px">
  Actions
  <span class="sub" onclick="selectAll()">Select all</span>
</div>
<div class="list-card" id="action-list"></div>

<div class="section-hd" style="padding-top:18px">Output</div>
<div class="area-block">
  <textarea id="output" placeholder="Result appears here…"></textarea>
  <div class="area-stats">
    <span id="out-chars">0 chars</span>&nbsp;·&nbsp;
    <span id="out-words">0 words</span>&nbsp;·&nbsp;
    <span id="out-lines">0 lines</span>
  </div>
  <div class="area-btns">
    <button class="icon-btn" id="copyBtn" onclick="copyOut()">⬆ Copy</button>
    <button class="icon-btn" onclick="swapText()">⇅ Swap</button>
    <span style="margin-left:auto;font-size:13px;color:var(--muted)">Autosaves locally.</span>
  </div>
</div>

</div>

<div class="bar">
  <div class="bar-inner">
    <button class="btn btn-ghost" style="flex:0 0 auto;padding:13px 16px" onclick="swapText()">⇅</button>
    <button class="btn btn-accent" onclick="applyActions()">Apply Actions</button>
    <button class="btn btn-ghost" id="copyBtn2" onclick="copyOut()">Copy</button>
  </div>
</div>

<script>
const ACTIONS=[
  {k:'trim',       label:'Trim & collapse spaces',               bg:'#e8f5e9',fg:'#2e7d32',bd:'Sp'},
  {k:'trimlines',  label:'Trim each line',                       bg:'#e0f2f1',fg:'#00695c',bd:'TL'},
  {k:'empty',      label:'Remove empty lines',                   bg:'#f9fbe7',fg:'#558b2f',bd:'EL'},
  {k:'singlebreak',label:'Remove single linebreaks (keep paragraphs)', bg:'#fff3e0',fg:'#e65100',bd:'Lb'},
  {k:'allbreaks',  label:'Remove all linebreaks',                bg:'#fbe9e7',fg:'#bf360c',bd:'Ab'},
  {k:'dupes',      label:'Remove duplicate lines',               bg:'#f3e5f5',fg:'#6a1b9a',bd:'Du'},
  {k:'sort',       label:'Sort lines A → Z',                     bg:'#e3f2fd',fg:'#1565c0',bd:'So'},
  {k:'join',       label:'Join lines with ", "',                  bg:'#fce4ec',fg:'#ad1457',bd:'Jn'},
  {k:'quotes',     label:'Remove quotes',                        bg:'#ffebee',fg:'#c62828',bd:'Qu'},
  {k:'braces',     label:'Remove braces & brackets',             bg:'#e8eaf6',fg:'#283593',bd:'{}'},
  {k:'markdown',   label:'Remove markdown',                      bg:'#e8f5e9',fg:'#1b5e20',bd:'Md'},
  {k:'headings',   label:'Headings → ALL CAPS',                  bg:'#fff8e1',fg:'#e65100',bd:'H#'},
  {k:'lower',      label:'lowercase',                            bg:'#eceff1',fg:'#37474f',bd:'lc'},
  {k:'upper',      label:'UPPERCASE',                            bg:'#e8eaf6',fg:'#1a237e',bd:'UC'},
  {k:'sentence',   label:'Sentence case',                        bg:'#ffebee',fg:'#b71c1c',bd:'Sc'},
  {k:'jsonline',   label:'JSON → one line',                      bg:'#e0f7fa',fg:'#006064',bd:'JS'},
];

const input=document.getElementById('input');
const output=document.getElementById('output');
input.value=localStorage.getItem('ts_input')||'';
output.value=localStorage.getItem('ts_output')||'';

const list=document.getElementById('action-list');
ACTIONS.forEach(a=>{
  const row=document.createElement('div');
  row.className='action-row';
  row.dataset.k=a.k;
  row.innerHTML=`<div class="badge" style="background:${a.bg};color:${a.fg}">${a.bd}</div><div class="row-label">${a.label}</div><div class="chkbox">✓</div>`;
  row.addEventListener('click',()=>row.classList.toggle('on'));
  list.appendChild(row);
});

function calcStats(text){
  return {
    chars: text.length,
    words: text.trim()?text.trim().split(/\s+/).length:0,
    lines: text?text.split('\n').length:0,
  };
}
function updateStats(text,cp,wp,lp){
  const s=calcStats(text);
  cp.textContent=s.chars+' chars';
  wp.textContent=s.words+' words';
  lp.textContent=s.lines+' lines';
}
const ist=[document.getElementById('st-chars'),document.getElementById('st-words'),document.getElementById('st-lines')];
const ost=[document.getElementById('out-chars'),document.getElementById('out-words'),document.getElementById('out-lines')];
function refreshStats(){updateStats(input.value,...ist);updateStats(output.value,...ost);}
refreshStats();

input.addEventListener('input',()=>{localStorage.setItem('ts_input',input.value);updateStats(input.value,...ist);});
output.addEventListener('input',()=>{localStorage.setItem('ts_output',output.value);updateStats(output.value,...ost);});

function active(){return[...document.querySelectorAll('.action-row.on')].map(r=>r.dataset.k);}
function setActive(keys){document.querySelectorAll('.action-row').forEach(r=>r.classList.toggle('on',keys.includes(r.dataset.k)));}
function selectAll(){
  const allKeys=ACTIONS.map(a=>a.k);
  setActive(active().length===allKeys.length?[]:allKeys);
}

function recipe(name){
  setActive([]);
  if(name==='clear'){
    ['removeStart','keepStart','findText','replaceText'].forEach(id=>document.getElementById(id).value='');
    return;
  }
  if(name==='prompt') setActive(['markdown','trimlines','singlebreak','empty','trim']);
  if(name==='markdown') setActive(['markdown','empty']);
  if(name==='json') setActive(['jsonline']);
  applyActions();
}

function applyActions(){
  let t=input.value;
  const rs=document.getElementById('removeStart').value;
  const ks=document.getElementById('keepStart').value;
  if(rs) t=t.split('\n').filter(x=>!x.startsWith(rs)).join('\n');
  if(ks) t=t.split('\n').filter(x=>x.startsWith(ks)).join('\n');
  const find=document.getElementById('findText').value;
  const repl=document.getElementById('replaceText').value;
  if(find){
    if(document.getElementById('findRegex').checked){
      try{t=t.replace(new RegExp(find,'g'),repl);}catch(e){}
    }else{
      t=t.split(find).join(repl);
    }
  }
  active().forEach(a=>{
    if(a==='empty')      t=t.split('\n').filter(x=>x.trim()).join('\n');
    if(a==='trimlines')  t=t.split('\n').map(x=>x.trim()).join('\n');
    if(a==='dupes'){const seen=new Set();t=t.split('\n').filter(x=>!seen.has(x)&&(seen.add(x),true)).join('\n');}
    if(a==='sort')       t=t.split('\n').sort((x,y)=>x.localeCompare(y)).join('\n');
    if(a==='join')       t=t.split('\n').filter(x=>x.trim()).join(', ');
    if(a==='quotes')     t=t.replace(/["']/g,'');
    if(a==='braces')     t=t.replace(/[{}\[\]()]/g,'');
    if(a==='markdown')   t=t.replace(/\[(.*?)\]\((.*?)\)/g,'$1').replace(/^\s*[-*+]\s+/gm,'').replace(/^#{1,6}\s+/gm,'').replace(/^\s*>\s?/gm,'').replace(/[*_`~]/g,'');
    if(a==='headings')   t=t.replace(/^#+\s*(.*)$/gm,(m,p)=>p.toUpperCase());
    if(a==='trim')       t=t.replace(/[ \t]+/g,' ').replace(/^ | $/gm,'').trim();
    if(a==='singlebreak')t=t.replace(/([^\n])\n([^\n])/g,'$1 $2');
    if(a==='allbreaks')  t=t.replace(/\n+/g,' ');
    if(a==='lower')      t=t.toLowerCase();
    if(a==='upper')      t=t.toUpperCase();
    if(a==='sentence')   t=t.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g,c=>c.toUpperCase());
    if(a==='jsonline'){try{t=JSON.stringify(JSON.parse(t));}catch(e){}}
  });
  output.value=t;
  localStorage.setItem('ts_output',t);
  updateStats(output.value,...ost);
}

function pasteIn(){
  navigator.clipboard.readText().then(t=>{
    input.value=t;
    localStorage.setItem('ts_input',t);
    updateStats(input.value,...ist);
  }).catch(()=>{});
}
function clearIn(){
  input.value='';
  localStorage.setItem('ts_input','');
  updateStats(input.value,...ist);
}
function flash(ids){
  ids.forEach(id=>{
    const b=document.getElementById(id);
    if(!b)return;
    const old=b.textContent;
    b.textContent=id==='copyBtn'?'✓ Copied':'Copied!';
    b.classList.add('ok');
    setTimeout(()=>{b.textContent=old;b.classList.remove('ok');},1200);
  });
}
function copyOut(){navigator.clipboard.writeText(output.value).then(()=>flash(['copyBtn','copyBtn2']));}
function swapText(){
  const a=input.value;
  input.value=output.value;
  output.value=a;
  localStorage.setItem('ts_input',input.value);
  localStorage.setItem('ts_output',output.value);
  refreshStats();
}
</script>
</body>
</html>
