<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regex Helper · Text Surgery</title>
<style>
:root{--bg:#111;--card:#1b1b1b;--field:#222;--text:#eee;--muted:#aaa;--border:#444;--accent:#4da3ff;--ok:#3fb950;--hl:#5a4a00}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text);padding-bottom:24px}
header{position:sticky;top:0;z-index:10;background:#161616;padding:12px;border-bottom:1px solid #333;display:flex;gap:10px;align-items:center}
header a{color:var(--accent);text-decoration:none;font-weight:700;white-space:nowrap}
input,textarea{font-family:inherit;font-size:16px}
input[type=text],input:not([type]){width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--field);color:#fff}
.wrap{padding:12px;max-width:1000px;margin:auto}
.card{background:var(--card);padding:12px;border-radius:14px;margin-bottom:12px}
.card h3{margin:0 0 10px}
code,kbd{font-family:ui-monospace,Menlo,Consolas,monospace}
.tester input.pat{font-family:ui-monospace,Menlo,Consolas,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.split input{flex:1;min-width:140px}
button{padding:10px 14px;border:none;border-radius:10px;background:var(--accent);color:white;font-weight:700;cursor:pointer}
button.ghost{background:var(--field);color:var(--text);border:1px solid var(--border)}
small{color:var(--muted)}
textarea{width:100%;min-height:110px;background:var(--field);color:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;resize:vertical}
.flags label{display:inline-flex;align-items:center;gap:6px;background:var(--field);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.result{white-space:pre-wrap;word-break:break-word;background:var(--field);border:1px solid var(--border);border-radius:10px;padding:12px;min-height:48px}
.result mark{background:var(--hl);color:#ffe89a;border-radius:3px;padding:0 1px}
.status{font-size:14px;margin-top:8px}
.status.err{color:#ff6b6b}
.status.ok{color:var(--ok)}
.cat{margin:18px 0 8px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.tok{background:var(--field);border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;transition:border-color .15s}
.tok:hover{border-color:var(--accent)}
.tok .t{font-family:ui-monospace,Menlo,Consolas,monospace;color:#9ad1ff;font-size:15px}
.tok .d{color:var(--text);font-size:14px;margin-top:3px}
.tok .ex{color:var(--muted);font-size:12px;margin-top:4px;font-family:ui-monospace,Menlo,Consolas,monospace}
.copytip{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ok);color:#04210d;padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.copytip.show{opacity:1}
</style>
</head>
<body>
<header>
  <a href="index.html">← Text Surgery</a>
  <input id="search" type="text" placeholder="Search regex (e.g. digit, email, start of line)...">
</header>
<div class="wrap">

<div class="card tester">
<h3>Try it</h3>
<div class="row split">
  <input id="pat" class="pat" type="text" placeholder="Pattern, e.g.  \d+">
  <input id="repl" type="text" placeholder="Replace with (optional)... use $1 for groups">
</div>
<div class="row flags" style="margin-top:10px">
  <label><input type="checkbox" id="fg" checked> g <small>global</small></label>
  <label><input type="checkbox" id="fi"> i <small>ignore case</small></label>
  <label><input type="checkbox" id="fm"> m <small>multiline</small></label>
  <label><input type="checkbox" id="fs"> s <small>dotall</small></label>
  <span style="margin-left:auto"><small>Active: <code id="liveflags">g</code></small></span>
</div>
<textarea id="test" placeholder="Paste sample text to test against..."></textarea>
<div class="cat" style="margin:12px 0 6px">Matches highlighted</div>
<div id="result" class="result"></div>
<div id="status" class="status"></div>
<div class="row" style="margin-top:10px">
  <button onclick="copyPattern()">Copy Pattern</button>
  <small>Tip: clicking any token below appends it to your pattern.</small>
</div>
</div>

<div class="card">
<h3>Cheat Sheet &amp; Recipes</h3>
<small>Click a card to insert its token/pattern. Use the search box to filter.</small>
<div id="sheet"></div>
</div>

</div>
<div id="copytip" class="copytip">Copied!</div>

<script>
const CATS=[
 ["Common Recipes",[
   ["\\d+","One or more digits (a number)","\"item 42\" -> 42"],
   ["\\b\\w+@\\w+\\.\\w+\\b","Simple email","\"a@b.com\""],
   ["https?:\\/\\/\\S+","A URL","\"https://x.com/y\""],
   ["^\\s*-\\s*","List bullet at line start","\"- item\" -> \"item\""],
   ["\\s{2,}","Two or more whitespace (collapse)","\"a   b\""],
   ["^\\s+|\\s+$","Leading/trailing whitespace (trim)","\"  hi  \""],
   ["\\r?\\n","A line break (any OS)",""],
   ["\\n{2,}","Blank line / paragraph break","keep paragraphs"],
   ["[\"'`]","Any kind of quote",""],
   ["[{}\\[\\]()]","Any bracket or brace",""],
   ["#{1,6}\\s+","Markdown heading marker","\"## Title\""],
   ["\\[(.*?)\\]\\((.*?)\\)","Markdown link -> keep $1 text","\"[text](url)\""],
 ]],
 ["Single Characters",[
   [".","Any character except newline",""],
   ["\\d","A digit (0-9)",""],
   ["\\D","Not a digit",""],
   ["\\w","Word char (letter, digit, _)",""],
   ["\\W","Not a word char",""],
   ["\\s","Whitespace (space, tab, newline)",""],
   ["\\S","Not whitespace",""],
   ["\\.","A literal dot",""],
 ]],
 ["Character Sets",[
   ["[abc]","Any of a, b, or c",""],
   ["[^abc]","Anything except a, b, c",""],
   ["[a-z]","Any lowercase letter",""],
   ["[A-Z]","Any uppercase letter",""],
   ["[0-9]","Any digit",""],
   ["[a-zA-Z0-9]","Any letter or digit",""],
 ]],
 ["Anchors & Boundaries",[
   ["^","Start of line/string","needs m flag per-line"],
   ["$","End of line/string","needs m flag per-line"],
   ["\\b","Word boundary","\\bword\\b"],
   ["\\B","Not a word boundary",""],
 ]],
 ["Quantifiers",[
   ["*","0 or more","a* "],
   ["+","1 or more","a+ "],
   ["?","0 or 1 (optional)","colou?r"],
   ["{3}","Exactly 3","\\d{3}"],
   ["{2,4}","Between 2 and 4","\\d{2,4}"],
   ["{2,}","2 or more","\\d{2,}"],
   ["+?","1 or more, lazy (shortest)","\".*?\""],
 ]],
 ["Groups & Alternation",[
   ["(abc)","Capture group -> $1, $2...","reorder/replace"],
   ["(?:abc)","Group without capturing",""],
   ["cat|dog","Either cat or dog",""],
   ["(?<name>\\d+)","Named capture group",""],
 ]],
 ["Lookaround",[
   ["(?=abc)","Followed by abc (lookahead)",""],
   ["(?!abc)","NOT followed by abc",""],
   ["(?<=abc)","Preceded by abc (lookbehind)",""],
   ["(?<!abc)","NOT preceded by abc",""],
 ]],
 ["Replacement Tokens",[
   ["$1","Insert 1st capture group","reorder text"],
   ["$&","The whole match",""],
   ["$`","Text before match",""],
   ["$'","Text after match",""],
 ]],
];

const pat=document.getElementById('pat');
const repl=document.getElementById('repl');
const test=document.getElementById('test');
const fg=document.getElementById('fg'),fi=document.getElementById('fi'),fm=document.getElementById('fm'),fs=document.getElementById('fs');
const resultEl=document.getElementById('result');
const statusEl=document.getElementById('status');

function flags(){return (fg.checked?'g':'')+(fi.checked?'i':'')+(fm.checked?'m':'')+(fs.checked?'s':'');}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function highlight(text,source,f){
 const g=new RegExp(source,f.includes('g')?f:f+'g');
 let out='',last=0,m,guard=0;
 while((m=g.exec(text))!==null){
   if(guard++>100000)break;
   out+=esc(text.slice(last,m.index));
   out+='<mark>'+esc(m[0])+'</mark>';
   last=m.index+m[0].length;
   if(m[0]==='')g.lastIndex++;
 }
 out+=esc(text.slice(last));
 return out;
}

function run(){
 const f=flags();
 document.getElementById('liveflags').textContent=f||'(none)';
 statusEl.className='status';
 statusEl.textContent='';
 if(!pat.value){resultEl.innerHTML='<small>Enter a pattern above to see matches.</small>';return;}
 try{new RegExp(pat.value,f);}
 catch(e){statusEl.className='status err';statusEl.textContent='⚠ '+e.message;resultEl.innerHTML='';return;}
 const text=test.value;
 const gre=new RegExp(pat.value,f.includes('g')?f:f+'g');
 let count=0;
 try{count=(text.match(gre)||[]).length;}catch(e){}
 resultEl.innerHTML=highlight(text,pat.value,f)||'<small>(no text)</small>';
 if(repl.value!==''){
   try{
     const out=text.replace(new RegExp(pat.value,f),repl.value);
     statusEl.className='status ok';
     statusEl.textContent=count+' match'+(count===1?'':'es')+'. Replacement preview below.';
     resultEl.innerHTML+='<div class="cat" style="margin:12px 0 6px">After replace</div><div style="white-space:pre-wrap">'+esc(out)+'</div>';
   }catch(e){statusEl.className='status err';statusEl.textContent='⚠ '+e.message;}
 }else{
   statusEl.className='status ok';
   statusEl.textContent=count+' match'+(count===1?'':'es')+'.';
 }
}

[pat,repl,test,fg,fi,fm,fs].forEach(el=>el.addEventListener('input',run));

function insert(tok){
 pat.value+=tok;
 pat.focus();
 run();
}

function copyPattern(){
 navigator.clipboard.writeText(pat.value).then(showTip);
}
function showTip(){
 const t=document.getElementById('copytip');
 t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),1000);
}

const sheet=document.getElementById('sheet');
CATS.forEach(([cat,items])=>{
 const h=document.createElement('div');h.className='cat';h.textContent=cat;
 sheet.appendChild(h);
 const grid=document.createElement('div');grid.className='grid';
 items.forEach(([t,d,ex])=>{
   const c=document.createElement('div');c.className='tok';
   c.innerHTML='<div class="t">'+esc(t)+'</div><div class="d">'+esc(d)+'</div>'+(ex?'<div class="ex">'+esc(ex)+'</div>':'');
   c.dataset.search=(t+' '+d+' '+ex).toLowerCase();
   c.addEventListener('click',()=>insert(t));
   grid.appendChild(c);
 });
 sheet.appendChild(grid);
});

document.getElementById('search').addEventListener('input',e=>{
 const q=e.target.value.toLowerCase();
 document.querySelectorAll('.grid').forEach(grid=>{
   let any=false;
   grid.querySelectorAll('.tok').forEach(c=>{
     const show=c.dataset.search.includes(q);
     c.style.display=show?'block':'none';
     if(show)any=true;
   });
   grid.style.display=any?'grid':'none';
   grid.previousElementSibling.style.display=any?'block':'none';
 });
});

run();
</script>
</body>
</html>
